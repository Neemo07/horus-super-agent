# Ruff configuration for the first-party Python scripts and tests.
# E9/F63/F7/F82 catch syntax errors, undefined names, and unreachable code
# without forcing formatting changes across the vendored skill packages.
line-length = 100
target-version = "py38"
exclude = [
    ".git",
    ".opencode/skills",
    "adapters",
]

[lint]
select = ["E9", "F63", "F7", "F82"]
