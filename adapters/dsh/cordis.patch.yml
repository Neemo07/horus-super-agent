# Horus Super Agent v0.7.8 — DeepSeek Harness (DSH) Desktop App / Web UI Cordis MCP Patch
# Merge into: $DSH_HOME/profiles/<profile>/cordis.patch.yml (DSH reloads live).
# Requires Node.js >= 22.5.0 for horus-context-mode built-in node:sqlite.
- insert:
    - id: horus-context-mode
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: 'horus-context-mode'
        transport: stdio
        command: 'node'
        args:
          - '.dsh/context-mode/server.js'
        toolCallTimeoutMs: 120000

